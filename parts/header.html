<!-- wp:html -->
<script>
(function () {

  /* Anti-flash thème */
  var STORAGE_KEY = 'spiphoto-theme';
  var root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    localStorage.setItem(STORAGE_KEY, t);
  }
  var saved     = localStorage.getItem(STORAGE_KEY);
  var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  applyTheme(saved || preferred);

  document.addEventListener('DOMContentLoaded', function () {

    /* Déplacer logo + titre */
    var brandBlocks = document.querySelector('.sp-brand-blocks');
    var logoSlot    = document.getElementById('sp-logo-slot');
    var idSlot      = document.getElementById('sp-identity-slot');
    if (brandBlocks && logoSlot && idSlot) {
      var logo  = brandBlocks.querySelector('.wp-block-site-logo');
      var group = brandBlocks.querySelector('.wp-block-group');
      if (logo)  logoSlot.appendChild(logo);
      if (group) idSlot.appendChild(group);
      brandBlocks.remove();
    }

    /* Déplacer navigation Secondary → topbar */
    var secBlocks = document.querySelector('.sp-secondary-nav-blocks');
    var secSlot   = document.getElementById('sp-secondary-nav-slot');
    if (secBlocks && secSlot) {
      var secNav = secBlocks.querySelector('.wp-block-navigation');
      if (secNav) secSlot.appendChild(secNav);
      secBlocks.remove();
    }

    /* Déplacer navigation Primary → barre catégories */
    var primBlocks = document.querySelector('.sp-primary-nav-blocks');
    var primSlot   = document.getElementById('sp-primary-nav-slot');
    if (primBlocks && primSlot) {
      var primNav = primBlocks.querySelector('.wp-block-navigation');
      if (primNav) primSlot.appendChild(primNav);
      primBlocks.remove();
    }

    /* Toggle thème */
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', function () {
        applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    }

    /* Sticky shadow */
    var header = document.getElementById('site-header');
    if (header) {
      window.addEventListener('scroll', function () {
        header.classList.toggle('scrolled', window.scrollY > 40);
      }, { passive: true });
    }

    /* Menu mobile */
    var mobileBtn = document.querySelector('.mobile-menu-btn');
    var catsBar   = document.getElementById('cats-nav');
    if (mobileBtn && catsBar) {
      mobileBtn.addEventListener('click', function () {
        var open = catsBar.classList.toggle('is-open');
        mobileBtn.setAttribute('aria-expanded', String(open));
      });
    }

    /* Lien actif */
    var path = window.location.pathname;
    document.querySelectorAll('#sp-primary-nav-slot a, #sp-secondary-nav-slot a').forEach(function (a) {
      var href = a.getAttribute('href');
      if (href && href !== '/' && path.startsWith(href)) {
        a.classList.add('active');
      }
    });

  });

})();
</script>
<!-- /wp:html -->
