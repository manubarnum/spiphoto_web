<!-- ══════════════════════════════════════════════════════
     SCRIPT — Thème jour/nuit + déplacement des blocs WP
     ══════════════════════════════════════════════════════ -->
<!-- wp:html -->
<script>
(function () {

  /* ── Anti-flash thème ───────────────────────────── */
  var STORAGE_KEY = 'spiphoto-theme';
  var root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    localStorage.setItem(STORAGE_KEY, t);
  }
  var saved     = localStorage.getItem(STORAGE_KEY);
  var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  applyTheme(saved || preferred);

  /* ── DOM ready ──────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function () {

    /* Déplacer logo + titre dans .header-brand */
    var brandBlocks = document.querySelector('.sp-brand-blocks');
    var logoSlot    = document.getElementById('sp-logo-slot');
    var idSlot      = document.getElementById('sp-identity-slot');
    if (brandBlocks && logoSlot && idSlot) {
      var logo  = brandBlocks.querySelector('.wp-block-site-logo');
      var group = brandBlocks.querySelector('.wp-block-group');
      if (logo)  logoSlot.appendChild(logo);
      if (group) idSlot.appendChild(group);
      brandBlocks.remove();
    }

    /* Déplacer la navigation Secondary dans la topbar */
    var secNavBlocks = document.querySelector('.sp-secondary-nav-blocks');
    var secNavSlot   = document.getElementById('sp-secondary-nav-slot');
    if (secNavBlocks && secNavSlot) {
      var secNav = secNavBlocks.querySelector('.wp-block-navigation');
      if (secNav) secNavSlot.appendChild(secNav);
      secNavBlocks.remove();
    }

    /* Déplacer la navigation Primary dans la barre cats */
    var primNavBlocks = document.querySelector('.sp-primary-nav-blocks');
    var primNavSlot   = document.getElementById('sp-primary-nav-slot');
    if (primNavBlocks && primNavSlot) {
      var primNav = primNavBlocks.querySelector('.wp-block-navigation');
      if (primNav) primNavSlot.appendChild(primNav);
      primNavBlocks.remove();
    }

    /* Toggle thème jour/nuit */
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', function () {
        applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      });
    }

    /* Sticky header shadow */
    var header = document.getElementById('site-header');
    if (header) {
      window.addEventListener('scroll', function () {
        header.classList.toggle('scrolled', window.scrollY > 40);
      }, { passive: true });
    }

    /* Menu mobile — toggle barre primaire */
    var mobileBtn = document.querySelector('.mobile-menu-btn');
    var catsBar   = document.getElementById('cats-nav');
    if (mobileBtn && catsBar) {
      mobileBtn.addEventListener('click', function () {
        var open = catsBar.classList.toggle('is-open');
        mobileBtn.setAttribute('aria-expanded', String(open));
      });
    }

    /* Marquer le lien actif */
    var path = window.location.pathname;
    document.querySelectorAll('#sp-primary-nav-slot a, #sp-secondary-nav-slot a').forEach(function (a) {
      var href = a.getAttribute('href');
      if (href && path.startsWith(href) && href !== '/') {
        a.classList.add('active');
      }
    });

  });

})();
</script>
<!-- /wp:html -->
