<script>
(function(){
  // ── Thème jour/nuit ────────────────────────────
  var STORAGE_KEY = 'spiphoto-theme';
  var root = document.documentElement;

  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    localStorage.setItem(STORAGE_KEY, t);
  }
  var saved = localStorage.getItem(STORAGE_KEY);
  var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  applyTheme(saved || preferred);

  document.addEventListener('DOMContentLoaded', function() {

    // Déplacer les blocs WP (logo + titre) dans la structure header
    var brandBlocks = document.querySelector('.sp-brand-blocks');
    var logoSlot    = document.getElementById('sp-logo-slot');
    var idSlot      = document.getElementById('sp-identity-slot');
    if (brandBlocks && logoSlot && idSlot) {
      var logo  = brandBlocks.querySelector('.wp-block-site-logo');
      var group = brandBlocks.querySelector('.wp-block-group');
      if (logo)  logoSlot.appendChild(logo);
      if (group) idSlot.appendChild(group);
      brandBlocks.remove();
    }

    // Toggle thème
    var btn = document.getElementById('theme-toggle');
    if (btn) btn.addEventListener('click', function(){
      applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });

    // Sticky scroll
    var header = document.getElementById('site-header');
    if (header) window.addEventListener('scroll', function(){
      header.classList.toggle('scrolled', window.scrollY > 40);
    }, {passive:true});

    // Menu mobile
    var mobileBtn = document.querySelector('.mobile-menu-btn');
    var catsNav   = document.getElementById('cats-nav');
    if (mobileBtn && catsNav) mobileBtn.addEventListener('click', function(){
      var open = catsNav.classList.toggle('is-open');
      mobileBtn.setAttribute('aria-expanded', open);
    });

    // Marquer lien actif
    var path = window.location.pathname;
    document.querySelectorAll('.cats-nav a, .topbar-nav a').forEach(function(a){
      var href = a.getAttribute('href');
      if (href && path.startsWith(href)) a.classList.add('active');
    });
  });
})();
</script>
<!-- /wp:html -->
