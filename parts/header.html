<!-- wp:html -->
<script>
(function(){

  /* ── Anti-flash thème ── */
  var k = 'spiphoto-theme';
  var root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    localStorage.setItem(k, t);
  }
  var saved = localStorage.getItem(k);
  var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  applyTheme(saved || preferred);

  /* ── Injecter le bouton toggle dans .topbar-right ── */
  function injectToggle() {
    var right = document.querySelector('.topbar-right') || document.querySelector('.header-topbar-inner') || document.querySelector('.site-header');
    if (!right || document.getElementById('theme-toggle')) return;
    var btn = document.createElement('button');
    btn.className = 'theme-toggle';
    btn.id = 'theme-toggle';
    btn.setAttribute('aria-label', 'Basculer thème clair/sombre');
    btn.innerHTML =
      '<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>' +
      '<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' +
      '<span class="toggle-label-dark">Jour</span>' +
      '<span class="toggle-label-light">Nuit</span>';
    btn.addEventListener('click', function(){
      applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
    right.appendChild(btn);
  }

  /* ── DOMContentLoaded ── */
  document.addEventListener('DOMContentLoaded', function() {

    injectToggle();

    /* Sticky header shadow */
    var header = document.querySelector('.site-header');
    if (header) window.addEventListener('scroll', function(){
      header.classList.toggle('scrolled', window.scrollY > 40);
    }, {passive: true});

    /* Marquer lien actif */
    var path = window.location.pathname;
    document.querySelectorAll('.cats-navigation a, .topbar-navigation a').forEach(function(a){
      var href = a.getAttribute('href');
      if (href && href !== '/' && path.startsWith(href)) {
        a.classList.add('active');
        a.setAttribute('aria-current', 'page');
      }
    });

  });

})();
</script>
<!-- /wp:html -->
